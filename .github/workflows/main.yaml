name: CI/CD Pipeline
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install
        working-directory: ./dsc-app

      - name: Run ESLint
        run: pnpm run lint
        working-directory: ./dsc-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          FLASK_ENV: ${{ secrets.FLASK_ENV }}
          VITE_REACT_APP_EDITOR_KEY: ${{ secrets.VITE_REACT_APP_EDITOR_KEY }}
          VITE_REACT_APP_API_BASE_URL: ${{ secrets.VITE_REACT_APP_API_BASE_URL }}
          VITE_PORT: ${{ secrets.VITE_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Create backend .env file for build
          cat << EOF > flask-backend/.env
          SECRET_KEY=$SECRET_KEY
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          EMAIL_USER=$EMAIL_USER
          EMAIL_PASSWORD=$EMAIL_PASSWORD
          EMAIL_PORT=$EMAIL_PORT
          EMAIL_SERVICE=$EMAIL_SERVICE
          PUBLIC_URL=$PUBLIC_URL
          FLASK_ENV=$FLASK_ENV
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          EOF

          # Create frontend .env file for build
          cat << EOF > dsc-app/.env
          VITE_REACT_APP_EDITOR_KEY=$VITE_REACT_APP_EDITOR_KEY
          VITE_REACT_APP_API_BASE_URL=$VITE_REACT_APP_API_BASE_URL
          VITE_PORT=$VITE_PORT
          EOF

          docker compose build
          docker compose push

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            echo "SSH connection test successful"

            cd /home/opc/mds-dsc/
            git pull origin master

            # Create backend .env file with local database URL
            cat << EOF > flask-backend/.env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_SERVICE=${{ secrets.EMAIL_SERVICE }}
            PUBLIC_URL=${{ secrets.PUBLIC_URL }}
            FLASK_ENV=${{ secrets.FLASK_ENV }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF

            # Create frontend .env file
            cat << EOF > dsc-app/.env
            VITE_REACT_APP_EDITOR_KEY=${{ secrets.VITE_REACT_APP_EDITOR_KEY }}
            VITE_REACT_APP_API_BASE_URL=${{ secrets.VITE_REACT_APP_API_BASE_URL }}
            VITE_PORT=${{ secrets.VITE_PORT }}
            EOF

            # Create .env file for docker-compose
            cat << EOF > .env
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF

            # Ensure volume exists (create if it doesn't)
            docker volume inspect postgres_data >/dev/null 2>&1 || docker volume create --name=postgres_data

            # Stop, rebuild, and start containers
            docker compose down

            # Start DB first to ensure it's ready before other services
            docker compose up -d db

            # Wait for DB to be ready
            echo "Waiting for database to be ready..."
            sleep 10

            # Starting the rest of the services
            docker compose up -d --build

            # Waiting for backend container to be ready
            echo "Waiting for backend container to be ready..."
            sleep 10

            # Running Migrations
            echo "Running database migrations..."
            docker compose exec -T backend flask db current || true
            if ! docker compose exec -T backend flask db upgrade; then
              echo "Migration failed, attempting to recover..."
              docker compose logs backend
            fi

            # Clean up unused Docker resources
            echo "Cleaning up unused Docker resources..."
            docker system prune -a -f

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/opc/mds-dsc/
            docker compose ps
            docker compose logs --tail=50
