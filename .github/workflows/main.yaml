name: CI/CD Pipeline
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install
        working-directory: ./dsc-app

      - name: Run ESLint
        run: pnpm run lint
        working-directory: ./dsc-app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          ORIGINS_URL: ${{ secrets.ORIGINS_URL }}
          FLASK_ENV: ${{ secrets.FLASK_ENV }}
          VITE_REACT_APP_EDITOR_KEY: ${{ secrets.VITE_REACT_APP_EDITOR_KEY }}
          VITE_REACT_APP_API_BASE_URL: ${{ secrets.VITE_REACT_APP_API_BASE_URL }}
          VITE_PORT: ${{ secrets.VITE_PORT }}
        run: |
          # Create backend .env file for build
          cat << EOF > flask-backend/.env
          SECRET_KEY=$SECRET_KEY
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          EMAIL_USER=$EMAIL_USER
          EMAIL_PASSWORD=$EMAIL_PASSWORD
          EMAIL_PORT=$EMAIL_PORT
          EMAIL_SERVICE=$EMAIL_SERVICE
          ORIGINS_URL=$ORIGINS_URL
          FLASK_ENV=$FLASK_ENV
          EOF

          # Create frontend .env file for build
          cat << EOF > dsc-app/.env
          VITE_REACT_APP_EDITOR_KEY=$VITE_REACT_APP_EDITOR_KEY
          VITE_REACT_APP_API_BASE_URL=$VITE_REACT_APP_API_BASE_URL
          VITE_PORT=$VITE_PORT
          EOF

          docker compose build
          docker compose push

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            echo "Starting deployment..."

            # Pull and restart containers
            cd /home/opc/mds-dsc/
            docker compose pull
            docker compose up -d --build

            # Check if containers are running
            if ! docker compose ps | grep -q "Up"; then
              echo "Error: Some containers failed to start"
              docker compose logs
              exit 1
            fi

            # Wait for database to be ready
            echo "Waiting for database to be ready..."
            until docker compose exec db pg_isready -h db -p 5432; do
              echo "Database is unavailable - sleeping"
              sleep 1
            done

            # Run migrations
            docker compose exec backend sh -c 'flask db upgrade'

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/opc/mds-dsc/
            docker compose ps
            docker compose logs --tail=50
